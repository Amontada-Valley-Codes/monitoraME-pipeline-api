name: monitorame-pipeline

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-monitorame}:${POSTGRES_PASSWORD:-monitorame}@postgres:5432/${POSTGRES_DB:-monitorame}
    LOG_DATABASE_URL: postgresql://${POSTGRES_USER:-monitorame}:${POSTGRES_PASSWORD:-monitorame}@postgres:5432/${POSTGRES_DB:-monitorame}
    DATABASE_SSLMODE: disable
    LOG_DATABASE_SSLMODE: disable

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monitorame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitorame}
      POSTGRES_DB: ${POSTGRES_DB:-monitorame}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    <<: *app-service
    image: ${MIGRATION_IMAGE:-pipeline-migrate:local}
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    image: ${API_IMAGE:-pipeline-api:local}
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tce-scheduler:
    <<: *app-service
    image: ${TCE_SCHEDULER_IMAGE:-tce-scheduler:local}
    init: true
    command: ["python", "scripts/tce_scheduler.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  tce-worker:
    <<: *app-service
    image: ${TCE_WORKER_IMAGE:-tce-worker:local}
    init: true
    command: ["python", "scripts/tce_worker.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  pncp-worker-coleta:
    <<: *app-service
    image: ${PNCP_COLLECTION_IMAGE:-pncp-worker-coleta:local}
    init: true
    command: ["python", "scripts/pncp_worker.py", "coleta"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  pncp-worker-normalizacao:
    <<: *app-service
    image: ${PNCP_NORMALIZATION_IMAGE:-pncp-worker-normalizacao:local}
    init: true
    command: ["python", "scripts/pncp_worker.py", "normalizacao"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  pncp-worker-enriquecimento:
    <<: *app-service
    image: ${PNCP_ENRICHMENT_IMAGE:-pncp-worker-enriquecimento:local}
    init: true
    command: ["python", "scripts/pncp_worker.py", "enriquecimento"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  matching-nlp-worker:
    <<: *app-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_NLP: "1"
    image: ${MATCHING_NLP_IMAGE:-matching-nlp-worker:local}
    init: true
    command: ["python", "scripts/matching_nlp_worker.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: ${MATCHING_NLP_MEMORY_LIMIT:-2g}
    cpus: ${MATCHING_NLP_CPUS:-1.50}
    volumes:
      - matching_nlp_model_cache:/opt/huggingface
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-monitorame}:${POSTGRES_PASSWORD:-monitorame}@postgres:5432/${POSTGRES_DB:-monitorame}
      LOG_DATABASE_URL: postgresql://${POSTGRES_USER:-monitorame}:${POSTGRES_PASSWORD:-monitorame}@postgres:5432/${POSTGRES_DB:-monitorame}
      DATABASE_SSLMODE: disable
      LOG_DATABASE_SSLMODE: disable
      MATCHING_INTERNAL_API_TOKEN: ""
      NLP_EMBEDDING_DEVICE: ${NLP_EMBEDDING_DEVICE:-cpu}
      NLP_EMBEDDING_REVISION: ${NLP_EMBEDDING_REVISION:-fd1525a9fd15316a2d503bf26ab031a61d056e98}
      NLP_EMBEDDING_BATCH_SIZE: "1"
      NLP_EMBEDDING_IDLE_SECONDS: ${NLP_EMBEDDING_IDLE_SECONDS:-5}
      NLP_WORKER_IDLE_EXIT_SECONDS: ${NLP_WORKER_IDLE_EXIT_SECONDS:-5}
      NLP_MODEL_IDLE_UNLOAD_SECONDS: ${NLP_MODEL_IDLE_UNLOAD_SECONDS:-60}
      NLP_EMBEDDING_MAX_ATTEMPTS: ${NLP_EMBEDDING_MAX_ATTEMPTS:-5}
      HF_HOME: /opt/huggingface
      OMP_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"

volumes:
  matching_nlp_model_cache:
    name: ${MATCHING_NLP_CACHE_VOLUME:-monitorame_matching_nlp_hf_cache}
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-monitorame_pipeline_api_postgres_data}
