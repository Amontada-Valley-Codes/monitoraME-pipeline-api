name: monitorame-pipeline-api

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
  image: ${APP_IMAGE:-monitorame-pipeline-api:production}
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:?configure POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?configure POSTGRES_DB in .env}
    LOG_DATABASE_URL: postgresql://${POSTGRES_USER:?configure POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?configure POSTGRES_DB in .env}
    DATABASE_SSLMODE: disable
    LOG_DATABASE_SSLMODE: disable
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://api.monitorame.tech,https://monitorame.amontadavalley.com.br}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?configure POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?configure POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    <<: *app-service
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.monitorame-pipeline-api.rule: "Host(`pipeline.monitorame.tech`)"
      traefik.http.routers.monitorame-pipeline-api.entrypoints: websecure
      traefik.http.routers.monitorame-pipeline-api.tls: "true"
      traefik.http.routers.monitorame-pipeline-api.tls.certresolver: letsencrypt
      traefik.http.services.monitorame-pipeline-api.loadbalancer.server.port: "8000"
    networks:
      default: {}
      backend_internal:
        aliases:
          - pipeline-api
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  matching-nlp-worker:
    <<: *app-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_NLP: "1"
    image: ${MATCHING_NLP_IMAGE:-monitorame-matching-nlp:production}
    init: true
    command: ["python", "scripts/matching_nlp_worker.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: ${MATCHING_NLP_MEMORY_LIMIT:-2g}
    cpus: ${MATCHING_NLP_CPUS:-1.50}
    volumes:
      - matching_nlp_model_cache:/opt/huggingface
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?configure POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?configure POSTGRES_DB in .env}
      LOG_DATABASE_URL: postgresql://${POSTGRES_USER:?configure POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?configure POSTGRES_DB in .env}
      DATABASE_SSLMODE: disable
      LOG_DATABASE_SSLMODE: disable
      NLP_EMBEDDING_DEVICE: ${NLP_EMBEDDING_DEVICE:-cpu}
      NLP_EMBEDDING_REVISION: ${NLP_EMBEDDING_REVISION:-main}
      NLP_EMBEDDING_BATCH_SIZE: "1"
      NLP_EMBEDDING_IDLE_SECONDS: ${NLP_EMBEDDING_IDLE_SECONDS:-10}
      NLP_EMBEDDING_MAX_ATTEMPTS: ${NLP_EMBEDDING_MAX_ATTEMPTS:-5}
      HF_HOME: /opt/huggingface
      OMP_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"

volumes:
  matching_nlp_model_cache:
    name: ${MATCHING_NLP_CACHE_VOLUME:-monitorame_matching_nlp_hf_cache}
  postgres_data:
    name: monitorame_pipeline_api_postgres_data

networks:
  backend_internal:
    name: monitorame_backend_internal
